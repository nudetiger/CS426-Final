org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Requires JDK 17 or newer (Gradle 8.9 cannot run on Java 23+).
# Android Studio uses its bundled JBR automatically. From the command line, point JAVA_HOME at
# a JDK 17+, or set org.gradle.java.home in your own ~/.gradle/gradle.properties — a machine
# specific path is deliberately not committed here so the project builds on any machine.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
